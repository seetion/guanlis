<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Particle - Scatter Effect</title>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/examples/jsm/loaders/GLTFLoader": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js"
      }
    }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background-color: #000000; }
        canvas { display: block; }
        #particle-container { width: 100vw; height: 100vh; }

        /* ===== 底部信息栏样式 ===== */
        #bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 67px;
            background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.4) 70%, transparent 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 36px;
            z-index: 100;
            pointer-events: none;
            user-select: none;
        }
        #bottom-bar .info-left {
            display: flex;
            align-items: center;
            gap: 14px;
            pointer-events: auto;
        }
        #bottom-bar .logo-link {
            display: block;
            flex-shrink: 0;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        #bottom-bar .logo-link:hover {
            transform: scale(1.08);
            box-shadow: 0 0 16px rgba(0,255,102,0.3);
        }
        #bottom-bar .logo-img {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: cover;
            display: block;
            border: 1.5px solid rgba(0,255,102,0.4);
        }
        #bottom-bar .company-text {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        #bottom-bar .company-name {
            font-size: 15px;
            font-weight: 600;
            color: rgba(255,255,255,0.92);
            letter-spacing: 0.8px;
            font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif;
        }
        #bottom-bar .company-name-en {
            font-size: 11px;
            font-weight: 400;
            color: rgba(255,255,255,0.55);
            letter-spacing: 0.4px;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
        }
        #bottom-bar .info-right {
            display: flex;
            align-items: center;
            gap: 22px;
            pointer-events: auto;
        }
        #bottom-bar .datetime {
            text-align: right;
            line-height: 1.5;
        }
        #bottom-bar .datetime .date-str {
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.78);
            font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif;
            letter-spacing: 0.5px;
        }
        #bottom-bar .datetime .time-str {
            font-size: 20px;
            font-weight: 300;
            color: rgba(255,255,255,0.92);
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            letter-spacing: 1px;
        }
        #bottom-bar .weather-wrapper {
            position: relative;
            cursor: default;
        }
        #bottom-bar .weather-icon {
            font-size: 28px;
            line-height: 1;
            transition: transform 0.25s ease;
            display: block;
        }
        #bottom-bar .weather-wrapper:hover .weather-icon {
            transform: scale(1.18);
        }
        #bottom-bar .weather-tooltip {
            position: absolute;
            bottom: 48px;
            right: 0;
            background: rgba(20,20,20,0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            padding: 12px 16px;
            white-space: nowrap;
            font-size: 13px;
            color: rgba(255,255,255,0.9);
            font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif;
            line-height: 1.7;
            pointer-events: none;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        #bottom-bar .weather-tooltip::after {
            content: '';
            position: absolute;
            bottom: -6px;
            right: 16px;
            width: 12px;
            height: 12px;
            background: rgba(20,20,20,0.92);
            border-right: 1px solid rgba(255,255,255,0.12);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            transform: rotate(45deg);
        }
        #bottom-bar .weather-wrapper:hover .weather-tooltip {
            opacity: 1;
            transform: translateY(0);
        }
        #bottom-bar .weather-tooltip .weather-detail {
            color: rgba(255,255,255,0.65);
            font-size: 12px;
            margin-top: 3px;
        }

        @media (max-width: 768px) {
            #bottom-bar {
                padding: 0 18px;
                height: 55px;
            }
            #bottom-bar .company-name { font-size: 13px; }
            #bottom-bar .company-name-en { font-size: 10px; }
            #bottom-bar .datetime .time-str { font-size: 16px; }
            #bottom-bar .datetime .date-str { font-size: 11px; }
            #bottom-bar .weather-icon { font-size: 24px; }
            #bottom-bar .logo-img { width: 36px; height: 36px; }
        }

        /* ===== 按F11进入全屏提示 ===== */
        .fullscreen-hint {
            position: fixed;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.9);
            font-size: 15px;
            font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif;
            padding: 10px 24px;
            border-radius: 20px;
            letter-spacing: 1.5px;
            pointer-events: none;
            animation: hint-blink 1.2s ease-in-out infinite, hint-fadeout 0.6s ease-out 5s forwards;
        }
        @keyframes hint-blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        @keyframes hint-fadeout {
            0% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(20px); }
        }
    </style>
</head>
<body>
    <div id="particle-container"></div>

    <!-- ===== 底部信息栏 ===== -->
    <div id="bottom-bar">
        <div class="info-left">
            <a class="logo-link" href="https://seetion.cn" target="_blank" title="贵州希田智慧农业科技有限">
                <img class="logo-img" src="https://img.seetion.cn/images/png/400x400logo.png" alt="Seetion LOGO">
            </a>
            <div class="company-text">
                <span class="company-name">贵州希田智慧农业科技有限</span>
                <span class="company-name-en">Guizhou Seetion Smart Agriculture Technology Co., Ltd.</span>
            </div>
        </div>
        <div class="info-right">
            <div class="datetime">
                <div class="date-str" id="date-str">加载中...</div>
                <div class="time-str" id="time-str">--:--</div>
            </div>
            <div class="weather-wrapper">
                <span class="weather-icon" id="weather-icon">🌤️</span>
                <div class="weather-tooltip" id="weather-tooltip">
                    <div id="weather-text">加载天气中...</div>
                    <div class="weather-detail" id="weather-advice"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 按F11进入全屏提示 ===== -->
    <div class="fullscreen-hint">按F11进入全屏</div>

                case "rose": for (let i = 0; i < PARTICLE_COUNT; i++) { const t = (i / PARTICLE_COUNT) * Math.PI * 14; const k = 5; const r = Math.cos(k * t) * 15; const h = (Math.random() - 0.5) * 20; const x = r * Math.cos(t); const y = h; const z = r * Math.sin(t); const spread = 2.0; const color = Math.random() > 0.7 ? shapeGreen : shapeWhite; points.push({ pos: [x + (Math.random() - 0.5) * spread, y, z + (Math.random() - 0.5) * spread], col: [color.r, color.g, color.b] }); } break;
                case "cube": const cubeSize = 18; for (let i = 0; i < PARTICLE_COUNT; i++) { const face = Math.floor(Math.random() * 6); let x, y, z; const a = (Math.random() - 0.5) * cubeSize; const b = (Math.random() - 0.5) * cubeSize; switch (face) { case 0: x = cubeSize / 2; y = a; z = b; break; case 1: x = -cubeSize / 2; y = a; z = b; break; case 2: x = a; y = cubeSize / 2; z = b; break; case 3: x = a; y = -cubeSize / 2; z = b; break; case 4: x = a; y = b; z = cubeSize / 2; break; case 5: x = a; y = b; z = -cubeSize / 2; break; } const spread = 2.0; const color = Math.random() > 0.7 ? shapeGreen : shapeWhite; points.push({ pos: [x + (Math.random() - 0.5) * spread, y + (Math.random() - 0.5) * spread, z + (Math.random() - 0.5) * spread], col: [color.r, color.g, color.b] }); } break;
                case "pyramid": const pyrHeight = 25; const pyrBase = 20; for (let i = 0; i < PARTICLE_COUNT; i++) { const onBase = Math.random() < 0.3; let x, y, z; if (onBase) { x = (Math.random() - 0.5) * pyrBase; z = (Math.random() - 0.5) * pyrBase; y = -pyrHeight / 2; } else { const t = Math.random(); const baseX = (Math.random() - 0.5) * pyrBase * (1 - t); const baseZ = (Math.random() - 0.5) * pyrBase * (1 - t); x = baseX; y = -pyrHeight / 2 + t * pyrHeight; z = baseZ; } const spread = 2.0; const color = Math.random() > 0.7 ? shapeGreen : shapeWhite; points.push({ pos: [x + (Math.random() - 0.5) * spread, y + (Math.random() - 0.5) * spread, z + (Math.random() - 0.5) * spread], col: [color.r, color.g, color.b] }); } break;
                case "spiral": for (let i = 0; i < PARTICLE_COUNT; i++) { const t = (i / PARTICLE_COUNT) * Math.PI * 10; const r = 10 + Math.sin(t * 3) * 4; const x = r * Math.cos(t); const y = (i / PARTICLE_COUNT - 0.5) * 40; const z = r * Math.sin(t); const spread = 2.5; const color = Math.random() > 0.7 ? shapeGreen : shapeWhite; points.push({ pos: [x + (Math.random() - 0.5) * spread, y + (Math.random() - 0.5) * spread, z + (Math.random() - 0.5) * spread], col: [color.r, color.g, color.b] }); } break;
                case "star": for (let i = 0; i < PARTICLE_COUNT; i++) { const angle = Math.random() * Math.PI * 2; const starPoints = 5; const innerR = 8; const outerR = 18; const pointAngle = Math.floor(angle / (Math.PI * 2 / starPoints)) * (Math.PI * 2 / starPoints); const t = (angle - pointAngle) / (Math.PI / starPoints); let r; if (t < 1) { r = outerR - (outerR - innerR) * t; } else { r = innerR + (outerR - innerR) * (t - 1); } const x = r * Math.cos(angle); const z = r * Math.sin(angle); const y = (Math.random() - 0.5) * 15; const spread = 2.0; const color = Math.random() > 0.7 ? shapeGreen : shapeWhite; points.push({ pos: [x + (Math.random() - 0.5) * spread, y, z + (Math.random() - 0.5) * spread], col: [color.r, color.g, color.b] }); } break;
                case "sphere": for (let i = 0; i < PARTICLE_COUNT; i++) { const theta = Math.random() * Math.PI * 2; const phi = Math.acos(2 * Math.random() - 1); const r = 16; const x = r * Math.sin(phi) * Math.cos(theta); const y = r * Math.sin(phi) * Math.sin(theta); const z = r * Math.cos(phi); const spread = 2.5; const color = Math.random() > 0.7 ? shapeGreen : shapeWhite; points.push({ pos: [x + (Math.random() - 0.5) * spread, y + (Math.random() - 0.5) * spread, z + (Math.random() - 0.5) * spread], col: [color.r, color.g, color.b] }); } break;
                case "dna": for (let i = 0; i < PARTICLE_COUNT; i++) { const t = (i / PARTICLE_COUNT) * Math.PI * 8; const y = (i / PARTICLE_COUNT - 0.5) * 45; const r = 10; const strand = i % 3; let x, z; if (strand === 0) { x = r * Math.cos(t); z = r * Math.sin(t); } else if (strand === 1) { x = r * Math.cos(t + Math.PI); z = r * Math.sin(t + Math.PI); } else { const barPos = Math.random(); x = r * Math.cos(t) * (1 - barPos) + r * Math.cos(t + Math.PI) * barPos; z = r * Math.sin(t) * (1 - barPos) + r * Math.sin(t + Math.PI) * barPos; } const spread = 2.0; const color = Math.random() > 0.7 ? shapeGreen : shapeWhite; points.push({ pos: [x + (Math.random() - 0.5) * spread, y + (Math.random() - 0.5) * spread, z + (Math.random() - 0.5) * spread], col: [color.r, color.g, color.b] }); } break;
                case "infinity": const infScale = 25; for (let i = 0; i < PARTICLE_COUNT; i++) { const t = (i / PARTICLE_COUNT) * Math.PI * 6; const denom = 1 + Math.sin(t) * Math.sin(t); let x = infScale * Math.cos(t) / denom; let y = infScale * Math.sin(t) * Math.cos(t) / denom; const verticalSpread = (Math.random() - 0.5) * 20; const z = (Math.random() - 0.5) * 15 + Math.sin(t * 2) * 5; const thickness = 4.0; const offsetX = (Math.random() - 0.5) * thickness; const offsetY = (Math.random() - 0.5) * thickness + verticalSpread * 0.3; const offsetZ = (Math.random() - 0.5) * thickness; const color = Math.random() > 0.7 ? shapeGreen : shapeWhite; points.push({ pos: [x + offsetX, y + offsetY, z + offsetZ], col: [color.r, color.g, color.b] }); } break;
            }
            if (points.length > 0) {
                for (let i = 0; i < PARTICLE_COUNT; i++) { const i3 = i * 3; const point = points[i % points.length]; targetPositions[i3] = point.pos[0]; targetPositions[i3 + 1] = point.pos[1]; targetPositions[i3 + 2] = point.pos[2]; targetColors[i3] = point.col[0]; targetColors[i3 + 1] = point.col[1]; targetColors[i3 + 2] = point.col[2]; }
                geometry.attributes.targetPosition.needsUpdate = true;
                geometry.attributes.targetColor.needsUpdate = true;
                uploadedImage = "shape";
            }
        }
        initParticleCanvas();

    <!-- ===== 底部信息栏逻辑（日期时间、天气、键盘禁用） ===== -->
    <script>
    (function() {
        // ========== 日期时间星期更新 ==========
        const weekNames = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
        function pad(n) { return n < 10 ? '0' + n : n; }
        function updateDateTime() {
            const now = new Date();
            const y = now.getFullYear();
            const m = pad(now.getMonth() + 1);
            const d = pad(now.getDate());
            const week = weekNames[now.getDay()];
            const h = pad(now.getHours());
            const min = pad(now.getMinutes());
            const dateEl = document.getElementById('date-str');
            const timeEl = document.getElementById('time-str');
            if (dateEl) dateEl.textContent = y + '年' + m + '月' + d + '日 ' + week;
            if (timeEl) timeEl.textContent = h + ':' + min;
        }
        updateDateTime();
        setInterval(updateDateTime, 1000);

        // ========== 天气代码映射 ==========
        const weatherMap = {
            0:  { icon: '☀️', text: '晴' },
            1:  { icon: '🌤️', text: '少云' },
            2:  { icon: '⛅', text: '多云' },
            3:  { icon: '☁️', text: '阴' },
            45: { icon: '🌫️', text: '雾' },
            48: { icon: '🌫️', text: '雾凇' },
            51: { icon: '🌦️', text: '小毛毛雨' },
            53: { icon: '🌦️', text: '毛毛雨' },
            55: { icon: '🌧️', text: '大毛毛雨' },
            56: { icon: '🌨️', text: '冻毛毛雨' },
            57: { icon: '🌨️', text: '冻毛毛雨' },
            61: { icon: '🌧️', text: '小雨' },
            63: { icon: '🌧️', text: '中雨' },
            65: { icon: '🌧️', text: '大雨' },
            66: { icon: '🌨️', text: '冻雨' },
            67: { icon: '🌨️', text: '冻雨' },
            71: { icon: '❄️', text: '小雪' },
            73: { icon: '❄️', text: '中雪' },
            75: { icon: '❄️', text: '大雪' },
            77: { icon: '🌨️', text: '雪粒' },
            80: { icon: '🌦️', text: '阵雨' },
            81: { icon: '🌧️', text: '中等阵雨' },
            82: { icon: '🌧️', text: '大阵雨' },
            85: { icon: '🌨️', text: '小雪阵' },
            86: { icon: '🌨️', text: '大雪阵' },
            95: { icon: '⛈️', text: '雷暴' },
            96: { icon: '⛈️', text: '雷暴伴小冰雹' },
            99: { icon: '⛈️', text: '雷暴伴大冰雹' }
        };

        function getAdvice(temp, weatherCode, humidity) {
            const parts = [];
            if (temp >= 35) parts.push('天气炎热注意防暑');
            else if (temp >= 30) parts.push('天气较热注意补水');
            else if (temp <= 0) parts.push('天气寒冷注意保暖');
            else if (temp <= 10) parts.push('天气较凉注意添衣');
            if (humidity >= 85) parts.push('湿度较大注意防潮');
            if (weatherCode >= 95 && weatherCode <= 99) parts.push('有雷暴请注意安全');
            if ((weatherCode >= 61 && weatherCode <= 67) || (weatherCode >= 80 && weatherCode <= 82)) parts.push('有雨记得带伞');
            if (weatherCode >= 71 && weatherCode <= 77) parts.push('有雪注意路滑');
            return parts.join('，');
        }

        const WEATHER_API = 'https://api.open-meteo.com/v1/forecast?latitude=25.4598&longitude=107.6525&current=temperature_2m,relative_humidity_2m,weather_code&timezone=Asia/Shanghai';

        function fetchWeather() {
            fetch(WEATHER_API)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    var c = data.current;
                    var w = weatherMap[c.weather_code] || { icon: '🌤️', text: '未知' };
                    var temp = Math.round(c.temperature_2m);
                    var hum = c.relative_humidity_2m;
                    var iconEl = document.getElementById('weather-icon');
                    var textEl = document.getElementById('weather-text');
                    var adviceEl = document.getElementById('weather-advice');
                    if (iconEl) iconEl.textContent = w.icon;
                    if (textEl) textEl.textContent = w.text + '  气温' + temp + '°  湿度' + hum + '%';
                    if (adviceEl) {
                        var adv = getAdvice(temp, c.weather_code, hum);
                        adviceEl.textContent = adv || '';
                    }
                })
                .catch(function() {
                    var iconEl = document.getElementById('weather-icon');
                    var textEl = document.getElementById('weather-text');
                    if (iconEl) iconEl.textContent = '🌤️';
                    if (textEl) textEl.textContent = '天气数据获取失败';
                });
        }
        fetchWeather();
        setInterval(fetchWeather, 30 * 60 * 1000);

        // ========== 键盘禁用：F1-F10 和 F12 禁用，F11 保留 ==========
        window.addEventListener('keydown', function(e) {
            if (e.key === 'F11') return; // 保留 F11 全屏
            // F1~F10, F12
            if (/^F(1[0-2]|[1-9])$/.test(e.key) && e.key !== 'F11') {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }
        }, true);
    })();
    </script>
