<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>身份信息智能核验系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei",sans-serif;
        }
        body {
            background-color: #050a18;
            color: #e8edf5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-image: radial-gradient(#102040 1px,transparent 1px);
            background-size: 25px 25px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            border: 1px solid #1e65b8;
            background-color: rgba(8,16,32,0.85);
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 0 30px #0c4a90,inset 0 0 15px rgba(30,101,184,0.2);
        }
        .title {
            text-align: center;
            font-size: 24px;
            color: #36a8ff;
            letter-spacing: 2px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1e65b8;
            margin-bottom: 30px;
        }
        .input-wrap {
            margin-bottom: 25px;
        }
        #cardNum {
            width: 100%;
            height: 48px;
            background: #0a1428;
            border: 1px solid #2878c8;
            color: #ffffff;
            padding: 0 15px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        #cardNum:focus {
            border-color: #36a8ff;
            box-shadow: 0 0 8px #2878c8;
        }
        .btn {
            width: 100%;
            height: 48px;
            background: linear-gradient(90deg,#0f52a0,#1967c2);
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.2s;
        }
        .btn:hover {
            background: linear-gradient(90deg,#125fb8,#2176d8);
        }
        .result-box {
            margin-top: 30px;
            border: 1px dashed #2878c8;
            padding: 25px;
            line-height: 2.2;
        }
        .result-item {
            font-size: 15px;
        }
        .text-blue {
            color: #4cb2ff;
            font-weight: 500;
            margin-left: 8px;
        }
        .loading {
            color: #73b8ff;
            text-align: center;
        }
        .error {
            color: #ff5555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="title">身份编码智能解析平台</h2>
        <div class="input-wrap">
            <input type="text" id="cardNum" placeholder="请输入18位居民身份证号码">
        </div>
        <button class="btn" onclick="searchInfo()">开始解析核验</button>
        <div class="result-box" id="result">
            请输入证件号码进行查询
        </div>
    </div>

<script>
function searchInfo(){
    let id = document.getElementById('cardNum').value.trim();
    let res = document.getElementById('result');
    if(id.length !== 18){
        res.innerHTML = '<div class="error">输入格式错误，必须为18位身份证号码</div>';
        return;
    }
    res.innerHTML = '<div class="loading">数据检索中，请稍候...</div>';
    //调用稳定可用API
    fetch(`https://api.asilu.com/idcard/?id=${id}`)
    .then(res=>res.json())
    .then(data=>{
        res.innerHTML = `
        <div class="result-item">户籍所在地<span class="text-blue">${data.addr}</span></div>
        <div class="result-item">出生日期<span class="text-blue">${data.date}</span></div>
        <div class="result-item">性别<span class="text-blue">${data.sex}</span></div>
        `;
    })
    .catch(()=>{
        res.innerHTML = '<div class="error">接口请求失败，请稍后重试</div>';
    })
}
</script>
</body>
</html>
